<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width={{W}}, height={{H}}">
<style>
  :root {
    --bg: {{BG}}; --ink: {{INK}}; --muted: {{MUTED}}; --accent: {{ACCENT}};
    --accent-soft: {{ACCENT_SOFT}}; --line: {{LINE}}; --surface: {{SURFACE}};
    --pad: 84px;            /* ≈ 7.8 % side margin */
    --safe-bottom: 135px;   /* bottom 10 %: platform UI overlays — nothing important here */
    --band-h: 500px;        /* image band height (mode: band) */
    --focus: {{FOCUS}};     /* object-position for the image */
    --overlay: {{OVERLAY}}; /* 0–1 darkness of the gradient over a full-bleed image */
    --zoom: {{ZOOM}};       /* 1–2 crop-in on the image, anchored at --focus */
    --title-size: 88px;     /* one headline size for the whole set; band cards step down one notch */
    --title-size-band: 78px;
    --body-size: 58px;      /* body copy is deliberately headline-class: readable in a moving feed */
    --item-size: 56px;
    --sub-size: 46px;
    --wash-tint: {{WASH_TINT}}; /* 0.5–1: how much theme bg covers the blurred backdrop */
    --fade: {{FADE}};        /* 0.2–0.8: where (fraction of band height) the band photo starts dissolving */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: {{FONT_STACK}};
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    word-break: keep-all; overflow-wrap: anywhere; line-break: strict;
  }
  .card { position: relative; width: {{W}}px; height: {{H}}px; padding: var(--pad) var(--pad) calc(var(--safe-bottom) + 96px); display: flex; flex-direction: column; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 14px; background: var(--accent); z-index: 3; }

  /* ---------- images ---------- */
  .bg, .band { position: absolute; left: 0; top: 0; width: {{W}}px; overflow: hidden; z-index: 1; }
  .bg { height: {{H}}px; }
  .band { height: var(--band-h); }
  .bg img, .band img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus); transform: scale(var(--zoom)); transform-origin: var(--focus); }
  .bg::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,14,10,var(--overlay)) 0%, rgba(10,14,10,calc(var(--overlay) * 0.85)) 30%, rgba(10,14,10,calc(var(--overlay) * 0.35)) 62%, rgba(10,14,10,0.10) 100%); }
  .band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,14,10,0.34) 0%, rgba(10,14,10,0) 40%); }
  /* wash: blurred backdrop photo under text/band cards → the set keeps one atmosphere */
  .wash { position: absolute; inset: -80px; z-index: 0; overflow: hidden; }
  .wash img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus); filter: blur(70px) saturate(0.9) brightness(1.08); transform: scale(1.2); }
  .wash::before { content: ""; position: absolute; inset: 0; z-index: 1; background: var(--accent); mix-blend-mode: color; opacity: 0.55; } /* pull every leaked hue toward the brand */
  /* tint toward the brand, never neutral grey: grey over a photo reads as dirt, a warm/green cast reads as light */
  .wash::after { content: ""; position: absolute; inset: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 82%, var(--accent-soft)); opacity: var(--wash-tint); }
  .has-wash .footer { border-top-color: rgba(0,0,0,0.14); }
  /* band → page: the band itself goes transparent over its own blurred copy (ease-in, ~250 px) */
  .band { --f0: calc(var(--fade) * 100%); --fr: calc(100% - var(--fade) * 100%);
          -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 var(--f0), rgba(0,0,0,0.9) calc(var(--f0) + var(--fr) * 0.3), rgba(0,0,0,0.55) calc(var(--f0) + var(--fr) * 0.62), rgba(0,0,0,0.18) calc(var(--f0) + var(--fr) * 0.86), rgba(0,0,0,0) 100%);
          mask-image: linear-gradient(to bottom, #000 0%, #000 var(--f0), rgba(0,0,0,0.9) calc(var(--f0) + var(--fr) * 0.3), rgba(0,0,0,0.55) calc(var(--f0) + var(--fr) * 0.62), rgba(0,0,0,0.18) calc(var(--f0) + var(--fr) * 0.86), rgba(0,0,0,0) 100%); }
  .inline-img { position: relative; width: 100%; height: 340px; border-radius: 28px; overflow: hidden; margin: 32px 0 0; background: var(--surface); flex: 0 0 auto; }
  .inline-img img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus); }

  /* ---------- chrome ---------- */
  .meta { position: relative; z-index: 3; display: flex; justify-content: flex-start; align-items: center; font-size: 26px; font-weight: 800; letter-spacing: 0.01em; }
  .meta .series { color: #fff; background: var(--accent); padding: 12px 24px; border-radius: 999px; }
  .meta .page { display: none; }
  .footer { position: absolute; z-index: 3; left: var(--pad); right: var(--pad); bottom: var(--safe-bottom); display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: var(--muted); border-top: 2px solid var(--line); padding-top: 22px; }
  .footer .handle { font-weight: 700; }
  .main { position: relative; z-index: 2; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-start; padding: 170px 0 0; min-height: 0; }
  .mode-text.type-closing .main { padding-top: 36px; justify-content: center; }

  /* over an image: white type, pill labels */
  .mode-full .meta .series { background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,0.9); }
  .mode-full .footer { color: rgba(255,255,255,0.85); border-top-color: rgba(255,255,255,0.3); }
  .mode-full .main { justify-content: flex-end; padding-bottom: 8px; }
  .mode-full .kicker { margin-bottom: 26px; }
  .mode-full .title, .mode-full .body, .mode-full .quote, .mode-full .items li, .mode-full .col-body { color: #fff; }
  .mode-full .sub, .mode-full .who, .mode-full .lead, .mode-full .foot { color: rgba(255,255,255,0.88); }
  .mode-full .kicker { color: #fff; background: var(--accent); display: inline-block; padding: 10px 22px; border-radius: 999px; }
  .mode-full .em { color: #fff; background: linear-gradient(transparent 60%, rgba(255,255,255,0.3) 60%); }
  .mode-full .quote-wrap { border-left: none; padding-left: 0; }
  .mode-band .meta { position: absolute; left: var(--pad); top: calc(var(--band-h) + 36px); }
  .mode-band .main { justify-content: flex-start; padding-top: calc(var(--band-h) - var(--pad) + 36px + 56px + 26px); }

  /* ---------- type: headline-sized everywhere ---------- */
  .title { margin: 0; font-weight: 800; font-size: var(--title-size); line-height: 1.16; letter-spacing: -0.02em; text-wrap: balance; }
  .title.big { font-size: var(--title-size); }
  .mode-band .title { font-size: var(--title-size-band); }
  .kicker { margin: 0 0 30px; font-size: 34px; font-weight: 800; color: var(--accent); }
  .sub { margin: 32px 0 0; font-size: var(--sub-size); line-height: 1.42; color: var(--ink); font-weight: 500; }
  .lead { margin: 26px 0 0; font-size: var(--sub-size); line-height: 1.42; color: var(--muted); font-weight: 500; }
  .body { margin-top: 44px; font-size: var(--body-size); line-height: 1.48; font-weight: 500; max-height: 660px; overflow: hidden; }
  .mode-band .body { font-size: 52px; max-height: 410px; }
  .em { font-weight: 800; color: var(--ink); background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }
  .has-wash .em { background: linear-gradient(transparent 60%, color-mix(in srgb, var(--accent) 32%, #fff) 60%); }

  .quote-wrap { position: relative; padding-left: 40px; border-left: 12px solid var(--accent); }
  .qmark { position: absolute; left: 36px; top: -120px; font-size: 240px; line-height: 1; color: var(--accent-soft); font-weight: 800; }
  .mode-full .qmark, .mode-band .qmark { display: none; }
  .quote { margin: 0; font-size: var(--title-size); line-height: 1.16; font-weight: 800; letter-spacing: -0.02em; max-height: 700px; overflow: hidden; text-wrap: balance; }
  .mode-band .quote { font-size: var(--title-size-band); max-height: 410px; }
  .who { margin: 32px 0 0; font-size: 42px; color: var(--muted); font-weight: 700; }

  .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 34px; }
  .items li { display: flex; align-items: flex-start; gap: 28px; font-size: var(--item-size); line-height: 1.36; font-weight: 600; }
  .mode-band .items { gap: 18px; }
  .mode-band .items li { font-size: 46px; gap: 22px; line-height: 1.28; }
  .mode-band .body { margin-top: 24px; }
  .mode-band.type-closing .body { font-size: 46px; max-height: 300px; margin-top: 20px; }
  .mode-band.type-closing .cta { margin-top: 30px; }
  .mode-band .lead { margin-top: 16px; font-size: 36px; }
  .items .dot { flex: 0 0 22px; width: 22px; height: 22px; margin-top: 26px; border-radius: 50%; background: var(--accent); }
  .items .num { flex: 0 0 80px; width: 80px; height: 80px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: -6px; }
  .items .it { flex: 1 1 auto; min-width: 0; }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 44px; max-height: 700px; align-items: stretch; }
  .col { background: var(--surface); border: 2px solid var(--line); border-radius: 30px; padding: 44px 38px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
  .col.r { border-color: var(--accent); background: var(--accent-soft); }
  .has-wash .col { background: rgba(255,255,255,0.62); border-color: rgba(0,0,0,0.10); }
  .has-wash .col.r { background: color-mix(in srgb, var(--accent-soft) 78%, #fff); border-color: var(--accent); }
  .col-title { margin: 0 0 20px; font-size: 44px; font-weight: 800; color: var(--accent); }
  .col.l .col-title { color: var(--muted); }
  .col-body { font-size: 44px; line-height: 1.42; font-weight: 500; }
  .foot { margin: 40px 0 0; font-size: var(--sub-size); line-height: 1.38; color: var(--ink); font-weight: 700; }

  /* ---------- stat: one number per slide ---------- */
  .stat { display: flex; flex-direction: column; }
  .stat-value { margin: 0; display: flex; align-items: baseline; gap: 0; color: var(--accent); line-height: 0.95; letter-spacing: -0.06em; }
  .stat-num { font-size: 300px; font-weight: 800; font-variant-numeric: proportional-nums; font-feature-settings: "pnum" 1, "kern" 1; }
  .stat-num .k1 { margin-right: -0.07em; }
  .stat-unit { font-size: 92px; font-weight: 800; letter-spacing: -0.03em; word-spacing: 0; margin-left: 0.06em; }
  .stat-label { margin: 28px 0 0; font-weight: 800; font-size: var(--title-size); line-height: 1.16; letter-spacing: -0.02em; text-wrap: balance; }
  .stat-context { margin: 30px 0 0; font-size: var(--sub-size); line-height: 1.42; color: var(--ink); font-weight: 500; }
  .stat-source { margin: 26px 0 0; font-size: 32px; color: var(--muted); font-weight: 600; }
  .mode-full .stat-value, .mode-full .stat-label { color: #fff; }
  .mode-full .stat-context, .mode-full .stat-source { color: rgba(255,255,255,0.86); }
  .mode-band .stat-num { font-size: 220px; }
  .mode-band .stat-unit { font-size: 72px; }
  .mode-band .stat-label { font-size: var(--title-size-band); }

  /* CTA is a sentence, not a button: nothing in the image can be tapped, so it must not look tappable */
  .type-closing .cta { margin: 44px 0 0; display: flex; align-items: center; gap: 18px; color: var(--accent); font-size: 42px; font-weight: 800; line-height: 1.3; }
  .type-closing .cta::before { content: "→"; flex: 0 0 auto; font-weight: 800; }
  .mode-full.type-closing .cta { color: #fff; }
</style>
</head>
<body>
<div class="card type-{{TYPE}} mode-{{MODE}} {{WASH_CLASS}}">
  {{WASH_BLOCK}}
  {{IMAGE_BLOCK}}
  <div class="meta" data-qa="meta"><span class="series">{{SERIES}}</span><span class="page">{{PAGE}}</span></div>
  <div class="main">{{CONTENT}}</div>
  <div class="footer" data-qa="footer"><span class="handle">{{HANDLE}}</span><span class="page">{{PAGE}}</span></div>
</div>
<script>
  // Layout QA probe: read by the renderer from --dump-dom. Reports overflow, bounds, overlaps, image load state.
  function probe() {
    const r = { font: document.fonts.check('700 40px "{{FONT_CHECK}}"'), items: [], overlaps: [], images: [] };
    const boxes = [];
    for (const el of document.querySelectorAll('[data-qa]')) {
      const b = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      // Clipping only happens when overflow is not visible; visible overflow is caught by bounds checks.
      const clips = cs.overflow !== 'visible' || cs.overflowY !== 'visible';
      const overflow = clips && (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2);
      r.items.push({ id: el.dataset.qa, overflow, top: Math.round(b.top), bottom: Math.round(b.bottom),
                     left: Math.round(b.left), right: Math.round(b.right) });
      if (!el.closest('[data-qa] [data-qa]')) boxes.push({ id: el.dataset.qa, b });  // top-level boxes only
    }
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i].b, c = boxes[j].b;
      const x = Math.min(a.right, c.right) - Math.max(a.left, c.left);
      const y = Math.min(a.bottom, c.bottom) - Math.max(a.top, c.top);
      if (x > 4 && y > 4) r.overlaps.push([boxes[i].id, boxes[j].id]);
    }
    for (const img of document.querySelectorAll('img[data-qa-img]')) {
      r.images.push({ id: img.dataset.qaImg, loaded: img.complete && img.naturalWidth > 0, w: img.naturalWidth, h: img.naturalHeight });
    }
    document.body.setAttribute('data-qa-result', JSON.stringify(r));
  }
  const pending = Array.from(document.images).map(i => i.complete ? Promise.resolve() : new Promise(res => { i.onload = i.onerror = res; }));
  Promise.all([document.fonts.ready, ...pending]).then(probe);
</script>
</body>
</html>
