manifest_version: 1
name: donggu-sns
version: "2.9.0"
description: "Native publishing adapter with receipt-bound approval. Tistory and Maily call the loopback FastAPI publisher directly; other channels use n8n webhooks."
author: "강동현 (donggu)"
kind: standalone
requires_env:
  - SNS_WEBHOOK_TOKEN
  - PUBLISHER_API_TOKEN
  - SUPABASE_URL
  - SUPABASE_SERVICE_KEY
provides_tools:
  - donggu_publishing_preview
  - donggu_publishing_approve
  - donggu_publishing_confirm_maily
  - donggu_publishing_dispatch
  - donggu_publishing_receipt_status
