manifest_version: 1
name: donggu-obsidian
version: "1.9.0"
description: "Minimal native runtime for the existing crash-atomic CORE helper and Life OS Daily workflow: zero-write CORE plan, exact natural apply, recovery-only reconciliation, descriptor-relative read-back, planned-only revoke, committed-journal acknowledgement, and trusted-session Daily recording."
author: "강동현 (donggu)"
kind: standalone
provides_tools:
  - donggu_core_recovery_status
  - donggu_core_plan
  - donggu_core_receipt_status
  - donggu_core_apply
  - donggu_core_recover
  - donggu_core_readback
  - donggu_core_revoke
  - donggu_core_ack
  - donggu_life_os_status
  - donggu_life_os_start_daily
  - donggu_life_os_record
provides_hooks:
  - pre_gateway_dispatch
