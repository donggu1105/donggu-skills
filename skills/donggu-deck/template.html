<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덱 제목</title>
<link rel="icon" href="data:,">
<style>
/* 오프라인 발표 대비 — 폰트·차트 전부 로컬(assets/) */
@font-face{font-family:'Pretendard Variable';src:url('assets/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-style:normal;font-display:swap}
/* ── 토큰: 워크숍 '심기' 팔레트 (PPTX와 동일 계열, 데이터 마크만 검증 통과색 #2E9960) ── */
:root{
  --ink:#212B22; --muted:#6C7568; --green:#2C6E49; --green-mid:#55876B; --data:#2E9960;
  --dark:#16351F; --dark2:#1E4630; --tint:#E9F2EC; --card:#F5F8F5; --line:#D9E4DB;
  --accent:#B45309; --accent-tint:#FBF3E4; --accent-light:#EDBE71; --moss:#A9CDB6; --moss-dim:#7FA98D;
  --track:#E4EBE5; --bg:#FFFFFF;
  --f: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0C150F;font-family:var(--f);overflow:hidden;color:var(--ink);word-break:keep-all}

/* 16:9 레터박스 덱 */
.deck{position:absolute;inset:0;margin:auto;width:100vw;height:100vh;
  max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);overflow:hidden;background:var(--bg)}
.slide{position:absolute;inset:0;padding:clamp(28px,4.6vw,62px) clamp(30px,4.8vw,66px);
  background:var(--bg);opacity:0;visibility:hidden;transition:opacity .45s ease;overflow:hidden;
  display:flex;flex-direction:column}
.slide.active{opacity:1;visibility:visible}
.slide--dark{background:radial-gradient(1100px 700px at 82% 12%, rgba(46,153,96,.16), transparent 60%), linear-gradient(150deg, var(--dark) 0%, var(--dark2) 100%);color:#fff}

/* 타이포 */
.plabel{font-size:clamp(11px,.95vw,13.5px);letter-spacing:.22em;color:var(--muted);font-weight:600;margin-bottom:clamp(8px,1vw,14px)}
.slide--dark .plabel{color:var(--moss-dim)}
h1.t{font-size:clamp(30px,3.55vw,50px);line-height:1.16;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.slide--dark h1.t{color:#fff}
.sub{color:var(--muted);font-size:clamp(13px,1.3vw,18px);line-height:1.55}
.sec{font-size:clamp(11px,1vw,14px);letter-spacing:.2em;color:var(--muted);font-weight:700;margin:clamp(14px,1.8vw,26px) 0 clamp(6px,.8vw,10px)}
b.g{color:var(--green)} b.acc{color:var(--accent)}

/* 헤더(아이콘+제목) */
.head{display:flex;align-items:center;gap:clamp(10px,1.1vw,16px)}
.ic{flex:0 0 auto;width:clamp(38px,3.2vw,48px);height:clamp(38px,3.2vw,48px);border-radius:50%;
  background:var(--green);display:flex;align-items:center;justify-content:center}
.ic svg{width:58%;height:58%;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic--tint{background:var(--tint)} .ic--tint svg{stroke:var(--green)}

/* 진입 애니메이션 — .active 하위에서만 정의되어 슬라이드 재진입 시 재생 */
.a,.aL,.aS{opacity:0}
.slide.active .a{animation:fadeUp .62s cubic-bezier(.2,.7,.25,1) both;animation-delay:var(--d,0s)}
.slide.active .aL{animation:fadeLeft .62s cubic-bezier(.2,.7,.25,1) both;animation-delay:var(--d,0s)}
.slide.active .aS{animation:scaleIn .55s cubic-bezier(.2,.7,.25,1) both;animation-delay:var(--d,0s)}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* 레이아웃 */
.split{display:grid;grid-template-columns:1.04fr .96fr;gap:clamp(20px,2.6vw,40px);flex:1;min-height:0;align-items:stretch}
.split>*{display:flex;flex-direction:column;justify-content:center;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.5vw,22px)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.5vw,22px)}

/* 카드류 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px)}
.metric .n{font-size:clamp(26px,2.9vw,42px);font-weight:800;color:var(--green);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric .l{color:var(--muted);font-size:clamp(11px,1vw,14px);margin-top:6px;line-height:1.4}
.tipbox{background:var(--tint);border-radius:12px;padding:clamp(13px,1.5vw,20px) clamp(15px,1.7vw,22px);font-size:clamp(14.5px,1.35vw,18.5px);line-height:1.5}
.tipbox.warn{background:var(--accent-tint)}
.prb{display:inline-block;font-size:clamp(10px,.85vw,12px);font-weight:800;color:var(--accent);background:var(--accent-tint);
  border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.prob{font-size:clamp(15px,1.55vw,21px);line-height:1.5;margin-bottom:clamp(10px,1.2vw,16px)}

/* 여정 리본 (3부 관통 장치) */
.journey{display:flex;align-items:center;gap:6px;margin:clamp(8px,1.1vw,16px) 0 clamp(10px,1.3vw,18px);flex-wrap:nowrap}
.jstep{font-size:clamp(11px,1vw,13.5px);font-weight:700;padding:5px 13px;border-radius:99px;background:var(--card);
  color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.jstep.done{background:var(--tint);color:var(--green);border-color:var(--tint)}
.jstep.on{background:var(--green);color:#fff;border-color:var(--green)}
.jline{flex:0 0 clamp(10px,1.4vw,22px);height:2px;background:var(--line)}

/* 브라우저 프레임 (실화면 시연 자리) */
.browser{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:100%;
  box-shadow:0 18px 44px -22px rgba(23,59,43,.35)}
.browser .bar{background:var(--card);border-bottom:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:7px}
.browser .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.browser .url{margin-left:8px;background:var(--tint);color:var(--green);font-size:clamp(10px,.9vw,12.5px);font-weight:700;
  border-radius:99px;padding:3px 12px}
.browser .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:clamp(12px,1.6vw,22px);background:
  linear-gradient(var(--card) 1px, transparent 1px) 0 0/100% 34px, #fff}
.demo-t{color:var(--green);font-weight:800;font-size:clamp(13.5px,1.3vw,17px)}
.demo-s{color:var(--muted);font-size:clamp(10.5px,.95vw,12.5px);margin-bottom:clamp(6px,.9vw,12px)}
.menu{width:min(86%,420px)}
.menu .mi{display:flex;align-items:baseline;justify-content:space-between;padding:clamp(6px,.85vw,10px) 2px;
  border-bottom:1px dashed var(--line);font-size:clamp(12.5px,1.15vw,15.5px);font-weight:700}
.menu .mi:last-child{border-bottom:0}
.scr{color:var(--muted);font-weight:600;font-size:clamp(10px,.9vw,12px);font-variant-numeric:tabular-nums}

/* 비율 바(트랙형) — 도넛 대체, 팔레트 검증 통과형 */
.ratio-track{position:relative;height:clamp(26px,2.6vw,36px);border-radius:99px;background:var(--track);overflow:hidden;
  background-image:repeating-linear-gradient(135deg, rgba(108,117,104,.08) 0 6px, transparent 6px 12px)}
.ratio-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--data);border-radius:99px;box-shadow:0 0 0 2px #fff}
.slide.active .ratio-fill{animation:growW 1.1s .55s cubic-bezier(.2,.7,.25,1) both}
@keyframes growW{from{width:0}to{width:var(--w)}}
.legend{display:flex;gap:18px;margin-top:10px;font-size:clamp(11px,1vw,13.5px);color:var(--muted)}
.legend b{color:var(--ink)} .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* 표 */
table.qt{width:100%;border-collapse:collapse;font-size:clamp(12px,1.12vw,15px)}
table.qt th{color:var(--muted);font-size:clamp(10.5px,.95vw,12.5px);letter-spacing:.12em;text-align:left;font-weight:700;
  padding:0 10px 8px;border-bottom:1.5px solid var(--line)}
table.qt td{padding:clamp(8px,1vw,12px) 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
table.qt tr:last-child td{border-bottom:0}
table.qt td:first-child{font-weight:800;white-space:nowrap}
table.qt td.num{text-align:right;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}

/* 내비게이션 */
.progress{position:fixed;top:0;left:0;height:3px;background:var(--data);z-index:50;transition:width .35s ease}
.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:50;opacity:.85}
.nav button{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;font-size:15px;background:rgba(33,43,34,.08);color:var(--ink)}
.nav .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
body.on-dark .nav button{background:rgba(255,255,255,.14);color:#fff}
body.on-dark .nav .cnt{color:var(--moss-dim)}
.stamp{position:fixed;bottom:22px;left:26px;z-index:50;font-size:11px;letter-spacing:.14em;color:var(--muted);opacity:.75}
body.on-dark .stamp{color:var(--moss-dim)}

/* 표지 새싹 스트로크 드로잉 */
.sprout path{stroke-dasharray:120;stroke-dashoffset:120}
.slide.active .sprout path{animation:draw 1.1s ease forwards}
.slide.active .sprout path:nth-child(2){animation-delay:.35s}
.slide.active .sprout path:nth-child(3){animation-delay:.6s}
@keyframes draw{to{stroke-dashoffset:0}}

/* 3단계 카드 */
.stage{border-radius:16px;padding:clamp(14px,1.7vw,24px);position:relative;min-height:clamp(150px,17vw,215px);display:flex;flex-direction:column}
.stage .tag{position:absolute;top:clamp(10px,1.2vw,16px);right:clamp(12px,1.4vw,18px);font-size:clamp(10px,.9vw,12px);opacity:.85;display:flex;align-items:center;gap:5px}
.stage h3{font-size:clamp(16px,1.65vw,22px);font-weight:800;margin-bottom:8px}
.stage p{font-size:clamp(12px,1.12vw,15px);line-height:1.5;flex:1}
.chip{align-self:flex-start;font-size:clamp(10px,.92vw,12.5px);font-weight:800;border-radius:99px;padding:5px 13px;margin-top:10px}
.st-solid{background:var(--green);color:#fff}.st-solid p{color:var(--tint)}.st-solid .chip{background:#fff;color:var(--green)}
.st-tint{background:var(--tint);color:var(--ink)}.st-tint .chip{background:#fff;color:var(--green)}
.st-dash{background:#fff;border:1.6px dashed var(--green-mid)}.st-dash .chip{background:var(--accent-tint);color:var(--accent)}
.arrow{align-self:center;color:var(--line);font-size:clamp(18px,2vw,26px);font-weight:800}
.stage svg{width:clamp(16px,1.5vw,20px);height:clamp(16px,1.5vw,20px);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 경유 다이어그램 (S3) */
.flowbox{display:flex;flex-direction:column;align-items:stretch;gap:6px;height:100%;justify-content:center}
.fnode{border-radius:12px;padding:clamp(10px,1.25vw,16px) clamp(12px,1.4vw,18px);font-weight:700;font-size:clamp(12.5px,1.2vw,16px);text-align:center}
.fa{color:var(--green-mid);text-align:center;font-size:clamp(14px,1.5vw,20px);line-height:1;font-weight:800}

/* 피라미드 (S12) */
.pyr text{font-family:var(--f)}

/* 맺음 */
.sumrow{display:flex;gap:14px;align-items:flex-start;margin-bottom:clamp(12px,1.6vw,22px)}
.sumn{flex:0 0 auto;width:clamp(26px,2.3vw,32px);height:clamp(26px,2.3vw,32px);border-radius:50%;background:var(--moss);color:var(--dark);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(12px,1.1vw,15px)}
.sumrow p{font-size:clamp(14.5px,1.5vw,20px);line-height:1.45;padding-top:2px}
.bigq{font-size:clamp(22px,2.6vw,36px);font-weight:800;color:var(--accent-light);letter-spacing:-.01em}
.pulse{opacity:0}
.slide.active .pulse{animation:fadeUp .62s .85s cubic-bezier(.2,.7,.25,1) both, pulse 2.6s 2s ease-in-out infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 0 rgba(237,190,113,0)}50%{text-shadow:0 0 26px rgba(237,190,113,.45)}}

/* ── v2: 표지 사진·현장 목소리·드러커 사진·'왜?' 브레이크 ── */
.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.16;filter:saturate(.65) brightness(.92);z-index:0}
.zc{position:relative;z-index:1}
.voices{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px);flex:1;align-content:center}
.voice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,22px);transform:rotate(var(--r,0deg))}
.voice .q{font-size:clamp(30px,3vw,42px);line-height:.65;color:var(--green-mid);font-weight:800;display:block;margin-bottom:10px;font-family:Georgia,serif}
.voice p{font-size:clamp(13px,1.22vw,16px);line-height:1.5;color:var(--ink);font-weight:600}
.voice .src{display:block;margin-top:10px;font-size:clamp(10px,.9vw,12px);color:var(--muted);font-weight:600}
.photo{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.photo img{width:100%;display:block;object-fit:cover}
.photo .cap{padding:10px 14px 12px}
.why{font-size:clamp(110px,15vw,215px);font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1}

/* ── v3: 로고 워터마크·풀블리드 인용·사업 흐름도 ── */
.bg-logo{position:absolute;right:-2%;bottom:-9%;width:62%;opacity:.08;z-index:0;pointer-events:none}
.quote-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 16%;filter:grayscale(1) brightness(.4)}
.quote-scrim{position:absolute;inset:0;background:linear-gradient(100deg,rgba(13,27,18,.93) 0%,rgba(13,27,18,.64) 55%,rgba(13,27,18,.38) 100%)}
.bigquote{font-size:clamp(30px,4.3vw,62px);font-weight:800;color:#fff;line-height:1.38;letter-spacing:-.02em;margin-top:clamp(12px,1.6vw,22px)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr;gap:clamp(5px,.7vw,10px);align-items:stretch}
.fnode2{position:relative;display:flex;flex-direction:column;gap:8px;justify-content:center;min-height:clamp(150px,17vw,215px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.7vw,24px)}
.fverb{color:var(--green);font-weight:800;font-size:clamp(16px,1.8vw,24px);letter-spacing:-.01em}
.forg{font-weight:800;color:var(--ink);font-size:clamp(12px,1.15vw,15px)}
.fdesc{color:var(--muted);font-size:clamp(10.5px,.98vw,13px);line-height:1.42}
.loop{position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--accent-tint);color:var(--accent);font-weight:800;font-size:clamp(9.5px,.88vw,12px);border-radius:99px;padding:4px 13px}

/* ── v4: 5동사 순환 다이어그램·조직도 카드·목소리 타이포 페이지 ── */
.cycle{position:relative;width:min(39vw,500px);aspect-ratio:1;margin:0 auto}
.cycle .ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 44s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cdot{display:none}
@supports (offset-path: circle(35% at 50% 50%)){
  .cdot{display:block;position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:var(--data);
    box-shadow:0 0 0 5px rgba(46,153,96,.16);offset-path:circle(35% at 50% 50%);animation:travel 8s linear infinite}
  .cdot2{width:10px;height:10px;background:var(--moss);box-shadow:none;animation-delay:-4s}
}
@keyframes travel{to{offset-distance:100%}}
.cpos{position:absolute;transform:translate(-50%,-50%)}
.cnode{text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:15px;
  padding:clamp(10px,1.15vw,15px) clamp(14px,1.7vw,23px);box-shadow:0 12px 26px -16px rgba(23,59,43,.28);white-space:nowrap}
.cnode .fverb{display:block;font-size:clamp(17px,1.9vw,25px)}
.corg{display:block;margin-top:2px;color:var(--muted);font-weight:700;font-size:clamp(11px,1.05vw,13.5px)}
.ccenter{background:var(--tint);border-radius:18px;padding:clamp(11px,1.3vw,18px) clamp(15px,1.8vw,22px);
  text-align:center;color:var(--green);font-weight:800;font-size:clamp(12px,1.15vw,15.5px);line-height:1.4}
.ccenter .rot{display:block;width:fit-content;margin:0 auto 2px;font-size:clamp(21px,2.2vw,29px);animation:spin 10s linear infinite}
.orgimg{display:block;max-width:100%;max-height:clamp(360px,56vh,545px);width:auto;margin:0 auto;border-radius:10px}
.ocap{text-align:center;color:var(--muted);font-size:clamp(9.5px,.9vw,12px);font-weight:600;margin-top:8px}
.vline{display:flex;gap:clamp(12px,1.5vw,22px);align-items:baseline;font-size:clamp(18px,2.05vw,29px);font-weight:700;line-height:1.5;color:var(--ink)}
.vnum{flex:0 0 auto;color:var(--data);font-weight:800;font-size:clamp(14px,1.55vw,21px);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
.vsrc{display:inline-block;margin-left:clamp(10px,1.2vw,16px);color:var(--muted);font-size:clamp(10.5px,.95vw,13px);font-weight:600;white-space:nowrap}
u.key{text-decoration:underline;text-decoration-color:var(--data);text-decoration-thickness:3.5px;text-underline-offset:7px;text-decoration-skip-ink:none}

/* ── v5: 파트 실행 장(문제 → 메뉴 플로)·본질/KPI 타이포 ── */
.pbig{font-size:clamp(25px,2.8vw,41px);font-weight:700;line-height:1.55;color:var(--ink)}
.pdim{color:var(--muted);font-weight:600;font-size:.78em}
.pres{font-size:clamp(19px,2.1vw,29px);font-weight:800;color:var(--green)}
.mrow{display:flex;align-items:stretch;gap:clamp(7px,.9vw,13px);flex-wrap:wrap}
.mlab{flex:0 0 auto;align-self:center;font-weight:800;color:var(--green-mid);font-size:clamp(15px,1.5vw,20px);min-width:3.4em}
.mchip{display:flex;flex-direction:column;justify-content:center;gap:3px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
  padding:clamp(13px,1.5vw,20px) clamp(17px,1.9vw,27px);font-weight:800;font-size:clamp(16px,1.72vw,23px);color:var(--ink)}
.mchip i{font-style:normal;font-weight:600;color:var(--muted);font-size:clamp(11.5px,1.1vw,14.5px)}
.mchip.on{background:var(--green);border-color:var(--green);color:#fff}
.mchip.on i{color:var(--moss)}
.marr{align-self:center;color:var(--green-mid);font-weight:800;font-size:clamp(18px,1.9vw,25px)}

/* ── v6: HA/DR 카테고리 박스·상품 배지 ── */
.catbox{background:var(--tint);border-radius:18px;padding:clamp(16px,2vw,26px);display:flex;flex-direction:column;gap:clamp(8px,1vw,14px)}
.cathead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

/* ── v10: 파트 장 개별화 ── */
.mgstage{position:relative;height:clamp(140px,18vw,220px);margin-top:clamp(4px,.8vh,10px)}
.mgcard{position:absolute;top:10%;width:34%;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:clamp(18px,2.2vw,30px) 10px;text-align:center;font-weight:800;font-size:clamp(20px,2.2vw,31px);letter-spacing:-.01em;opacity:0}
.mgcard small{display:block;margin-top:7px;font-weight:600;color:var(--muted);font-size:clamp(11.5px,1.1vw,14.5px)}
.mg-l{left:5%}.mg-r{right:5%}
.mg-c{left:50%;top:0;width:40%;background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 16px 38px rgba(44,110,73,.28);padding:clamp(22px,2.6vw,36px) 10px}
.mg-c small{color:var(--moss)}
.slide.active .mg-l{animation:mgl 2.1s .4s cubic-bezier(.55,.08,.4,1) both}
.slide.active .mg-r{animation:mgr 2.1s .4s cubic-bezier(.55,.08,.4,1) both}
@keyframes mgl{0%{opacity:0;transform:translateY(10px)}13%{opacity:1;transform:none}50%{opacity:1;transform:none}86%,100%{opacity:0;transform:translateX(81%)}}
@keyframes mgr{0%{opacity:0;transform:translateY(10px)}13%{opacity:1;transform:none}50%{opacity:1;transform:none}86%,100%{opacity:0;transform:translateX(-81%)}}
.slide.active .mg-c{animation:mgc .65s 2.3s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes mgc{0%{opacity:0;transform:translateX(-50%) scale(.68)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
.mgcap{color:var(--muted);font-weight:700;font-size:clamp(13px,1.3vw,17px)}
.fnlwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.fnl text{font-weight:800}
.fnl-drop{opacity:0}
.slide.active .fnl-drop{animation:fnldrop 3.2s 1.3s cubic-bezier(.5,.05,.5,.95) infinite}
@keyframes fnldrop{0%{transform:translateY(0);opacity:0}10%{opacity:1;transform:translateY(20px)}32%{transform:translateY(86px)}56%{transform:translateY(152px)}80%{transform:translateY(218px)}90%{opacity:1}100%{transform:translateY(252px);opacity:0}}
.chvrow{display:flex;gap:7px}
.chv{position:relative;flex:1;color:#fff;font-weight:800;font-size:clamp(17px,1.8vw,25px);padding:clamp(18px,2.2vw,30px) 10px clamp(18px,2.2vw,30px) clamp(20px,2.4vw,34px);text-align:center;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 50%,calc(100% - 24px) 100%,0 100%,24px 50%)}
.chv:first-child{clip-path:polygon(0 0,calc(100% - 24px) 0,100% 50%,calc(100% - 24px) 100%,0 100%)}
.chv i{display:block;font-style:normal;font-weight:600;font-size:clamp(11px,1.05vw,14px);opacity:.85;margin-top:5px}
.dealtrack{position:relative;height:4px;background:var(--line);border-radius:99px;margin:clamp(30px,4.2vh,48px) 3% 0}
.dealcard{position:absolute;left:2%;top:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--green);color:var(--green);border-radius:99px;padding:8px 18px;font-weight:800;font-size:clamp(12.5px,1.25vw,16.5px);white-space:nowrap;box-shadow:0 8px 22px rgba(31,42,33,.14)}
.slide.active .dealcard{animation:dealgo 5.2s 1.25s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes dealgo{0%{left:2%}20%,28%{left:34%}48%,56%{left:66%}84%,100%{left:98%}}
.ma-ecg{width:100%;height:clamp(96px,13vw,160px)}
.ma-ecg path{stroke:var(--data);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 10;animation:ecg 1.6s linear infinite}
.matick{display:flex;justify-content:space-around;text-align:center;font-weight:800;color:var(--ink);font-size:clamp(13.5px,1.35vw,18px);margin-top:clamp(6px,.9vh,12px)}
.matick small{display:block;font-weight:600;color:var(--muted);font-size:clamp(11px,1.05vw,14px);margin-top:3px}
.flowsvg{display:block;width:min(100%,1200px);margin:0 auto}
.flowsvg .flowp{stroke:var(--green-mid);stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:14 10;animation:ecg 1.5s linear infinite}
.flowsvg text{font-weight:800}
.lnb{width:clamp(220px,24vw,330px);flex:0 0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:clamp(16px,1.8vw,24px);display:flex;flex-direction:column;gap:7px;box-shadow:0 14px 34px rgba(31,42,33,.08)}
.lnbh{font-size:clamp(11px,1.05vw,14px);letter-spacing:.18em;color:var(--muted);font-weight:700;margin-bottom:2px}
.lnbi{border-radius:11px;padding:clamp(9px,1.1vw,14px) clamp(11px,1.3vw,17px);font-weight:700;color:var(--muted);font-size:clamp(13.5px,1.35vw,18px)}
.lnbi.on{background:var(--green);color:#fff;font-weight:800}
.slide.active .lnb .lnbi{opacity:0;animation:fadeUp .4s both}
.slide.active .lnb .lnbi:nth-of-type(1){animation-delay:.4s}
.slide.active .lnb .lnbi:nth-of-type(2){animation-delay:.5s}
.slide.active .lnb .lnbi:nth-of-type(3){animation-delay:.6s}
.slide.active .lnb .lnbi:nth-of-type(4){animation-delay:.7s}
.slide.active .lnb .lnbi:nth-of-type(5){animation-delay:.8s}
.slide.active .lnb .lnbi.on{animation:fadeUp .5s 1s both, lnbpulse 2.6s 1.8s ease-in-out infinite}
@keyframes lnbpulse{0%,100%{box-shadow:0 0 0 0 rgba(44,110,73,.35)}50%{box-shadow:0 0 0 11px rgba(44,110,73,0)}}
.tiprow{font-weight:800;font-size:clamp(17px,1.85vw,26px);letter-spacing:-.01em}
.tiprow .marr{margin:0 4px}

@media (max-width:768px){ .split,.grid2,.grid3,.voices,.flow{grid-template-columns:1fr} .slide{overflow:auto} }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="deck" id="deck">

<!-- ─────────────────────────── 1 표지 ─────────────────────────── -->
<section class="slide slide--dark" data-dark>
  <div class="plabel a">부제 · 자리표시</div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vh,24px)">
    <h1 class="t a" style="--d:.15s;font-size:clamp(44px,5.6vw,84px)">발표 제목이 들어가는 자리</h1>
    <p class="a" style="--d:.4s;color:var(--moss);font-size:clamp(15px,1.6vw,22px);font-weight:700">한 줄 부제 자리</p>
  </div>
  <p class="a" style="--d:.7s;color:var(--moss-dim);font-size:clamp(11px,1.05vw,14px)">← → 이동 · F 전체 화면</p>
</section>

<!-- ─────────────────────────── 2 본문 골격 (3박자: 문제 → 심은 것 → 결과) ─────────────────────────── -->
<section class="slide">
  <div class="plabel a">1부 · 구획 라벨</div>
  <h1 class="t a" style="--d:.05s">장의 주장 한 문장이 제목이다</h1>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,32px)">
    <div class="a" style="--d:.16s">
      <div class="sec" style="margin:0 0 8px">맥락 라벨</div>
      <p class="pbig">큰 글자 주장 문단. <span class="pdim">보조 설명은 pdim으로 가라앉힌다.</span></p>
    </div>
    <p class="pres a" style="--d:.5s">결과 문장은 녹색 pres로 닫는다.</p>
  </div>
</section>

<!-- ─────────────────────────── 3 맺음 ─────────────────────────── -->
<section class="slide slide--dark" data-dark>
  <div class="plabel a">맺음</div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,2.8vh,30px)">
    <p class="a" style="--d:.2s;font-size:clamp(30px,3.6vw,54px);font-weight:800;letter-spacing:-.02em;color:#fff">마지막 큰 문장 자리.</p>
    <div class="a" style="--d:.6s"><p class="bigq pulse">청중에게 남길 질문 자리?</p></div>
  </div>
</section>

</div><!-- /deck -->

<div class="nav">
  <button onclick="go(cur-1)" aria-label="이전">←</button>
  <span class="cnt"><span id="cur">1</span> / <span id="tot">1</span></span>
  <button onclick="go(cur+1)" aria-label="다음">→</button>
</div>

<script>
const slides=[...document.querySelectorAll('.slide')];
let cur=1; const tot=slides.length;
document.getElementById('tot').textContent=tot;

function countUp(el){
  const target=parseFloat(el.dataset.count), dec=el.dataset.dec?+el.dataset.dec:0, dur=1050, t0=performance.now();
  (function tick(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3), v=target*e;
    el.textContent=v.toLocaleString('ko-KR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    if(p<1)requestAnimationFrame(tick);
  })(t0);
}
function activate(slide){ slide.querySelectorAll('[data-count]').forEach(countUp); }
function go(n){
  if(n<1)n=1; if(n>tot)n=tot;
  cur=n;
  slides.forEach((s,i)=>s.classList.toggle('active',i===n-1));
  document.getElementById('cur').textContent=n;
  document.getElementById('progress').style.width=(n/tot*100)+'%';
  document.body.classList.toggle('on-dark',slides[n-1].hasAttribute('data-dark'));
  history.replaceState(null,'','#'+n);
  activate(slides[n-1]);
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  if(e.key==='Home')go(1); if(e.key==='End')go(tot);
  if(e.key==='f'||e.key==='F'){document.documentElement.requestFullscreen?.();}
});
window.addEventListener('hashchange',()=>{const h=+location.hash.slice(1);if(h>=1&&h<=tot&&h!==cur)go(h);});
go(Math.min(Math.max(+(location.hash.slice(1))||1,1),tot));
</script>
</body>
</html>
